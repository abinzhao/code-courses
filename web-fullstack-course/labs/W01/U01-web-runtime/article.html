        <h1>一篇文章从哪里开始</h1>
        <p class="article-meta">林一 · 2026-10-10 · 4 分钟阅读</p>
        <p class="lead">
          在知识库里，文章只是内容；在浏览器里，它是一组需要被请求、接收和解析的
          字节。
        </p>
        <p>
          当你点击链接时，浏览器会根据地址创建请求，服务器会找到对应文件并返回
          响应。页面中的 HTML、CSS 和图片还可能继续触发新的资源请求。
        </p>
        <p>
          今天先不要急着记住所有协议细节。请打开 Network 面板，亲眼确认每一次
          请求的路径、状态码和响应类型。工程师的第一个工具不是猜测，而是证据。
        </p>
      </article>
